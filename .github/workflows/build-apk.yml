name: Build OfflinePay APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build fixed APK
        run: bash scripts/build.sh

      - name: Upload APK (Actions > run > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: OfflinePay-fixed-apk
          path: out/OfflinePay-fixed.apk
          if-no-files-found: error

      - name: Publish as GitHub Release (so you can download directly from phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OfflinePay build ${{ github.run_number }}
          files: out/OfflinePay-fixed.apk
